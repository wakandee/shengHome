{% extends 'base.html' %}

{% block content %}
<div class="main_container">
    <div class="contact_container">
    <h1>Contact Us</h1>
    <p>If you have any questions, feedback, or need assistance, feel free to reach out to us using the form below.</p>

    <form method="POST" action="/contact_us">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" class="form-control" placeholder="Write your message here" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</div>
</div>
<style type="text/css">
    .contact_container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    background: inherit;
    border-radius: 8px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
}

.contact_container p{
    align-items: center;
    margin-bottom: 20px;
}

.contact_container h1 {
    text-align: center;
    margin-bottom: 20px;
}

.contact_container .form-group {
    margin-bottom: 15px;
}

.contact_container label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.contact_container input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
}

.contact_container button {
    display: block;
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.contact_container button:hover {
    background-color: #0056b3;
}

</style>
{% endblock %}
